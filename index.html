<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suscripción</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .formulario {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .checkbox {
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1e7e34;
        }
    </style>
</head>
<body>

<div class="formulario">
    <h2>Suscripción</h2>

    <form>
        <!-- Validación automática de correo -->
        <input type="email" placeholder="Correo electrónico" required>

        <!-- Checkbox obligatorio -->
        <div class="checkbox">
            <label>
                <input type="checkbox" required>
                Acepto los términos y condiciones
            </label>
        </div>

        <button type="submit">Suscribirse</button>
    </form>
</div>

</body>
</html>
